body: |
  ## How the posts work

  Open the upload page on your phone, pick one or more photos, and send them. They go into a queue. Each morning at 10:00 AM Eastern, the oldest photo posts to @ace_naps with an Ace-voice caption and the same hashtags every time. The upload app is Nuxt. The queue and the daily post run on Supabase.

  ## How the loops are made

  The YouTube videos are pixel-art loops of Ace, a real dog, settling into a scene. This Halloween loop is a cozy fall evening: a glowing cottage, pumpkins, and a few visitors in the trees. They are made for sleep, or just leaving on.
