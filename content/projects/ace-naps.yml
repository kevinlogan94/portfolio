sections:
  - id: why
    title: Why it exists
    body: People kept asking how they could nap with Ace. Kevin gets to be with him every day and wanted to share that with everyone.
  - id: uploader
    title: "Part 1: the uploader"
    body: Friends and family Kevin invites can photograph Ace napping and upload photos from their phone. The photos land in a Supabase queue. A scheduled cron job publishes them to Instagram @ace_naps through the Instagram API.
    notes: "Nuxt for the invite-only upload UI. Supabase for the queue and the scheduled job. Instagram API for the daily post."
    images:
      - src: "/images/projects/ace-naps/ace-nap-1.webp"
        alt: "Ace, a fluffy cream-and-white dog, asleep curled up on a gray couch, his head resting on a black-and-white pillow with a green blanket behind him"
        href: https://www.instagram.com/ace_naps/
        width: 1200
        height: 900
      - src: "/images/projects/ace-naps/ace-nap-2.webp"
        alt: "Ace, a fluffy cream-and-white dog, napping curled up on a soft beige carpet with his eyes closed and the tip of his tongue peeking out"
        href: https://www.instagram.com/ace_naps/
        width: 900
        height: 1200
      - src: "/images/projects/ace-naps/ace-nap-3.webp"
        alt: "Ace, a fluffy cream-and-white dog, curled up asleep in a patch of sunlight on a navy patterned blanket, the tip of his tongue poking out"
        href: https://www.instagram.com/ace_naps/
        width: 900
        height: 1200
  - id: loops
    title: "Part 2: the loops"
    body: Phaser stitches Ace's pixel-art animations into 15-minute loops, then those loops go up on YouTube. The Halloween one below is a longer cut: three hours of a cozy fall evening.
    youtubeId: "ClAkKkYFMIg"
    youtubeLabel: "Play: Cozy Halloween loop (3 hours)"
  - id: how-it-works
    title: How it works
    columns:
      - title: Uploader
        steps:
          - Photograph Ace napping
          - Friends and family Kevin invites upload from a phone
          - Photos wait in a queue
          - A cron job posts to Instagram
      - title: Loops
        steps:
          - Pixel-art animations of Ace
          - Phaser stitches them into a 15-minute loop
          - Rendered and uploaded to YouTube
  - id: tech-stack
    title: Tech stack
    items:
      - Nuxt
      - Supabase
      - Instagram API
      - Phaser
      - YouTube
  - id: status
    title: Where things stand
    body: Ace is napping on Instagram, and the loops are up on YouTube. The uploader stays invite-only for people Kevin shares it with. The code for both parts is on GitHub.
    showLinks: true
